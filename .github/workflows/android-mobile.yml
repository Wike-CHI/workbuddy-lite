name: Android mobile preview
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android-mobile.yml']
  push:
    branches: ['main']
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android-mobile.yml']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android command-line tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npm test -- --runInBand
        working-directory: apps/mobile
      - run: node --test scripts/android/tests/*.test.mjs packages/termux-bridge/tests/*.test.mjs
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-mobile-arm64-preview
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
